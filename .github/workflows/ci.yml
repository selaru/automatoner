name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - name: OpenMP for LightGBM on macOS
        if: runner.os == 'macOS'
        run: brew install libomp
      - run: uv sync --extra tabular --extra mcp --extra dev
      # Heavy trainers (text, mlx, speech) are covered by tests/test_slow_real_models.py, which is opt-in (AUTOMATONER_SLOW=1).
      - run: uv run pytest -q --ignore=tests/test_slow_real_models.py
