[project]
name = "automatoner"
version = "0.1.0"
description = "Train tiny task-specific models from a browser: pick a base model, build a dataset, train, export for where it will run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cristian Selaru" }]
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
  "huggingface_hub>=0.30",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "psutil>=5.9",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# classic ML: anomaly detection and tabular classification, ONNX export
tabular = [
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "skl2onnx>=1.17",
  "onnxmltools>=1.12",
]
# Transformers, PEFT, tiny PyTorch models
text = [
  "torch>=2.4",
  "transformers>=4.45",
  "peft>=0.12",
  "datasets>=2.20",
  "accelerate>=0.33",
  "onnx>=1.16",
  "onnxruntime>=1.18",
  "onnxscript>=0.1",
]
# Apple Silicon only: mlx-lm LoRA training
mlx = ["mlx-lm>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# Needle 3 and Whistle (Cactus Compute)
speech = ["cactus-needle[train]"]
# export helpers
coreml = ["coremltools>=8; sys_platform == 'darwin'"]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[project.scripts]
automatoner = "automatoner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["automatoner"]

[tool.hatch.build.targets.wheel.force-include]
"recipes" = "automatoner/recipes"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
